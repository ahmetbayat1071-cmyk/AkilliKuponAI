name: Build Android ChatGPT V5 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AkilliKuponAI-chatgpt-v5.zip'
      - '.github/workflows/android-chatgpt-v5.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q 'AkilliKuponAI-chatgpt-v5.zip' -d source
      - name: Build APK
        working-directory: source/AkilliKuponAI
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AkilliKuponAI-chatgpt-v5-apk
          path: source/AkilliKuponAI/app/build/outputs/apk/debug/app-debug.apk
